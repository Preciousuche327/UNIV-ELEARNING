<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.25"/>
    </linearGradient>
    
    <!-- Hero Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="400" cy="300" r="240" fill="url(#bgGrad)" filter="url(#glow)" />
  <circle cx="180" cy="150" r="80" fill="#8b5cf6" fill-opacity="0.15" filter="url(#glow)"/>
  <circle cx="650" cy="450" r="100" fill="#ec4899" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Floating Elements Background -->
  <g opacity="0.6">
    <circle cx="150" cy="420" r="6" fill="#6366f1"/>
    <circle cx="680" cy="180" r="8" fill="#ec4899"/>
    <circle cx="220" cy="100" r="5" fill="#fbbf24"/>
    <polygon points="620,120 632,132 608,132" fill="#8b5cf6" transform="rotate(45 620 120)"/>
    <rect x="120" y="240" width="12" height="12" rx="3" fill="#6366f1" transform="rotate(15 120 240)"/>
  </g>

  <!-- Laptop / Tablet Main Device Frame -->
  <g filter="url(#dropShadow)">
    <!-- Base Plate Shadow -->
    <ellipse cx="400" cy="470" rx="260" ry="20" fill="#0f172a" opacity="0.3"/>
    
    <!-- Main Screen Body -->
    <rect x="220" y="160" width="360" height="250" rx="20" fill="#1e1b4b" stroke="url(#glassGrad)" stroke-width="2"/>
    <rect x="235" y="175" width="330" height="220" rx="12" fill="#0f172a"/>
    
    <!-- Screen Header/UI -->
    <path d="M 235 187 A 12 12 0 0 1 247 175 L 553 175 A 12 12 0 0 1 565 187 L 565 210 L 235 210 Z" fill="#1e293b"/>
    <circle cx="255" cy="192" r="5" fill="#ef4444"/>
    <circle cx="270" cy="192" r="5" fill="#f59e0b"/>
    <circle cx="285" cy="192" r="5" fill="#10b981"/>
    
    <!-- Code/UI Lines inside screen -->
    <rect x="260" y="230" width="140" height="14" rx="4" fill="url(#primaryGrad)"/>
    <rect x="260" y="255" width="280" height="8" rx="3" fill="#334155"/>
    <rect x="260" y="272" width="220" height="8" rx="3" fill="#334155"/>
    <rect x="260" y="289" width="250" height="8" rx="3" fill="#334155"/>
    
    <!-- Student Progress Card Overlay -->
    <rect x="390" y="240" width="150" height="110" rx="10" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="435" cy="275" r="18" fill="url(#accentGrad)"/>
    <!-- Checkmark icon -->
    <path d="M 428 275 L 433 280 L 443 270" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="460" y="265" width="65" height="7" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="460" y="278" width="45" height="6" rx="3" fill="#94a3b8"/>
    
    <!-- Progress Bar -->
    <rect x="410" y="315" width="110" height="8" rx="4" fill="#334155"/>
    <rect x="410" y="315" width="85" height="8" rx="4" fill="url(#goldGrad)"/>
  </g>

  <!-- Floating Graduation Cap (Top Right) -->
  <g filter="url(#dropShadow)" transform="translate(480, 80) rotate(-10)">
    <!-- Cap Base & Top -->
    <polygon points="90,20 170,50 90,80 10,50" fill="url(#primaryGrad)"/>
    <polygon points="90,80 170,50 90,56 10,50" fill="#4338ca" opacity="0.5"/>
    <path d="M 45 65 L 45 95 C 45 115 135 115 135 95 L 135 65" fill="#3730a3"/>
    
    <!-- Tassel -->
    <circle cx="90" cy="50" r="5" fill="url(#goldGrad)"/>
    <path d="M 90 50 Q 140 60 145 90" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
    <polygon points="140,90 150,90 148,110 142,110" fill="url(#goldGrad)"/>
  </g>

  <!-- Floating Stack of Books (Bottom Left) -->
  <g filter="url(#dropShadow)" transform="translate(130, 310) rotate(8)">
    <!-- Book 1 (Bottom - Purple) -->
    <rect x="20" y="100" width="140" height="24" rx="4" fill="#6366f1"/>
    <rect x="30" y="104" width="125" height="16" fill="#f8fafc"/>
    <rect x="15" y="100" width="18" height="24" rx="3" fill="#4f46e5"/>
    
    <!-- Book 2 (Middle - Pink) -->
    <rect x="30" y="74" width="130" height="22" rx="4" fill="#ec4899"/>
    <rect x="40" y="77" width="115" height="16" fill="#f8fafc"/>
    <rect x="25" y="74" width="18" height="22" rx="3" fill="#db2777"/>
    
    <!-- Book 3 (Top - Gold) -->
    <rect x="40" y="50" width="115" height="20" rx="4" fill="url(#goldGrad)"/>
    <rect x="50" y="53" width="100" height="14" fill="#f8fafc"/>
    <rect x="35" y="50" width="18" height="20" rx="3" fill="#d97706"/>
  </g>

  <!-- Floating Certificate Badge (Center Right) -->
  <g filter="url(#dropShadow)" transform="translate(560, 260) rotate(12)">
    <circle cx="45" cy="45" r="38" fill="#ffffff"/>
    <circle cx="45" cy="45" r="32" fill="url(#accentGrad)"/>
    <!-- Award Star -->
    <polygon points="45,23 51,35 64,37 54,46 57,59 45,52 33,59 36,46 26,37 39,35" fill="url(#goldGrad)"/>
    <!-- Ribbon Tails -->
    <polygon points="35,75 45,65 55,75 55,100 45,92 35,100" fill="#db2777"/>
  </g>

</svg>
