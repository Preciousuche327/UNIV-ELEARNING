<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="authBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="authPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="authPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="authShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="400" cy="300" r="230" fill="url(#authBgGrad)"/>

  <!-- Shield / Lock Security Card -->
  <g filter="url(#authShadow)">
    <rect x="240" y="150" width="320" height="300" rx="24" fill="#ffffff"/>
    
    <!-- Shield Icon -->
    <path d="M 400 190 C 440 210 470 200 470 200 L 470 270 C 470 320 400 350 400 350 C 400 350 330 320 330 270 L 330 200 C 330 200 360 210 400 190 Z" fill="url(#authPrimary)"/>
    
    <!-- Lock Inside Shield -->
    <rect x="382" y="260" width="36" height="28" rx="5" fill="#ffffff"/>
    <path d="M 390 260 L 390 250 A 10 10 0 0 1 410 250 L 410 260" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="400" cy="272" r="3" fill="#6d28d9"/>
    
    <!-- Security Verified Badge -->
    <rect x="280" y="380" width="240" height="40" rx="20" fill="url(#authPink)"/>
    <text x="400" y="405" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ACCOUNT SECURITY</text>
  </g>
</svg>
